name: BIST teknik tarama

on:
  schedule:
    # Saatler UTC. 15:45 UTC = 18:45 TSİ (kapanış sonrası), 04:30 UTC = 07:30 TSİ (yedek çalışma)
    - cron: "45 15 * * 1-5"
    - cron: "30 4 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: tarama
  cancel-in-progress: false

jobs:
  tarama:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Paketleri kur
        run: pip install -r requirements.txt

      - name: Taramayı çalıştır
        run: python tarama.py

      - name: Sonuçları kaydet
        run: |
          git config user.name "bist-tarama-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Değişiklik yok."
          else
            git commit -m "Tarama: $(TZ=Europe/Istanbul date '+%Y-%m-%d %H:%M')"
            git push
          fi
